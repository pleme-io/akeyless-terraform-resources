# NOTE: v2 placement in keys/ subdir. The legacy spec lives at misc/kmip_client.toml.
# KMIP clients have no update endpoint in the OpenAPI; any change to fields forces destroy+recreate.
[resource]
name = "akeyless_kmip_client_v2"
description = "Manages a KMIP client in Akeyless Vault (no update; changes force recreate)"
category = "kmip"

[crud]
create_endpoint = "/kmip-create-client"
create_schema = "kmipCreateClient"
read_endpoint = "/kmip-get-client"
read_schema = "kmipDescribeClient"
read_response_schema = "KMIPClientGetResponse"
delete_endpoint = "/kmip-delete-client"
delete_schema = "kmipDeleteClient"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = ["name", "certificate-ttl", "activate-keys-on-creation"]

[fields]

[read_mapping]
"name" = "name"
