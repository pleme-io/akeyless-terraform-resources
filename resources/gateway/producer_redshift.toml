[resource]
name = "akeyless_gateway_producer_redshift"
description = "Manages a Redshift gateway producer (deprecated; prefer akeyless_dynamic_secret_redshift)"
category = "gateway-producer"

[crud]
create_endpoint = "/gateway-create-producer-redshift"
create_schema = "gatewayCreateProducerRedshift"
update_endpoint = "/gateway-update-producer-redshift"
update_schema = "gatewayUpdateProducerRedshift"
read_endpoint = "/gateway-get-producer"
read_schema = "gatewayGetProducer"
read_response_schema = "DSProducerDetails"
delete_endpoint = "/gateway-delete-producer"
delete_schema = "gatewayDeleteProducer"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = ["name"]

[fields]

[read_mapping]
"item_name" = "name"
"item_targets_assoc.0.target_name" = "target_name"
"user_ttl" = "user_ttl"
