# NOTE: OpenAPI operationId is `gatewayCreateProducerOracleDb` though endpoint paths use `oracle`.
[resource]
name = "akeyless_gateway_producer_oracle"
description = "Manages an Oracle DB gateway producer (deprecated; prefer akeyless_dynamic_secret_oracle)"
category = "gateway-producer"

[crud]
create_endpoint = "/gateway-create-producer-oracle"
create_schema = "gatewayCreateProducerOracleDb"
update_endpoint = "/gateway-update-producer-oracle"
update_schema = "gatewayUpdateProducerOracleDb"
read_endpoint = "/gateway-get-producer"
read_schema = "gatewayGetProducer"
read_response_schema = "DSProducerDetails"
delete_endpoint = "/gateway-delete-producer"
delete_schema = "gatewayDeleteProducer"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = ["name"]

[fields]

[read_mapping]
"item_name" = "name"
"item_targets_assoc.0.target_name" = "target_name"
"user_ttl" = "user_ttl"
