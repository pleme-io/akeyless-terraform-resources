[resource]
name = "akeyless_rotated_secret_delete_sync"
description = "Delete a rotated-secret sync association"
category = "rotated_secret_sync"
kind = "action"

[action]
endpoint = "/rotated-secret-delete-sync"
schema = "rotatedSecretDeleteSync"
response_schema = "RotatedSecretDeleteSyncOutput"
mutating = true
sensitive_response_fields = []

[fields]
"name" = { required = true, description = "Rotated secret name" }
"usc-name" = { required = true, description = "Universal Secret Connector name" }
"remote-secret-name" = { description = "Remote Secret name to disambiguate" }
"delete-from-usc" = { type_override = "bool", description = "Also delete the secret from the remote USC" }
