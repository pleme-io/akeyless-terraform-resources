[resource]
name = "akeyless_gateway_producer_aws"
description = "Manages an AWS gateway producer (deprecated; prefer akeyless_dynamic_secret_aws)"
category = "gateway-producer"

[crud]
create_endpoint = "/gateway-create-producer-aws"
create_schema = "gatewayCreateProducerAws"
update_endpoint = "/gateway-update-producer-aws"
update_schema = "gatewayUpdateProducerAws"
read_endpoint = "/gateway-get-producer"
read_schema = "gatewayGetProducer"
read_response_schema = "DSProducerDetails"
delete_endpoint = "/gateway-delete-producer"
delete_schema = "gatewayDeleteProducer"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = ["name"]

[fields]

[read_mapping]
"item_name" = "name"
"aws_access_key_id" = "aws_access_key_id"
"aws_region" = "region"
"item_targets_assoc.0.target_name" = "target_name"
"user_ttl" = "user_ttl"
