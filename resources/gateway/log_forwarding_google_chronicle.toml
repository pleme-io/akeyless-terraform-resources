# NOTE: Log forwarding is a singleton configuration with no create/delete endpoint.
# See log_forwarding_aws_s3.toml for the full workaround rationale.
[resource]
name = "akeyless_gateway_log_forwarding_google_chronicle"
description = "Manages the Google Chronicle log forwarding configuration on the gateway (singleton)"
category = "log-forwarding"

[crud]
create_endpoint = "/gateway-update-log-forwarding-google-chronicle"
create_schema = "gatewayUpdateLogForwardingGoogleChronicle"
update_endpoint = "/gateway-update-log-forwarding-google-chronicle"
update_schema = "gatewayUpdateLogForwardingGoogleChronicle"
read_endpoint = "/gateway-get-log-forwarding"
read_schema = "gatewayGetLogForwarding"
read_response_schema = "LogForwardingConfigPart"
delete_endpoint = "/gateway-update-log-forwarding-google-chronicle"
delete_schema = "gatewayUpdateLogForwardingGoogleChronicle"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = []

[fields]

[read_mapping]
"target_log_type" = "name"
