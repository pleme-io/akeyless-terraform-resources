# NOTE: OpenAPI endpoint paths are inconsistent — create uses `/gateway-create-producer-hanadb`
# while update uses `/gateway-update-producer-hana`. The schema names use `HanaDb` for both.
[resource]
name = "akeyless_gateway_producer_hanadb"
description = "Manages a SAP HANA DB gateway producer (deprecated; prefer akeyless_dynamic_secret_hanadb)"
category = "gateway-producer"

[crud]
create_endpoint = "/gateway-create-producer-hanadb"
create_schema = "gatewayCreateProducerHanaDb"
update_endpoint = "/gateway-update-producer-hana"
update_schema = "gatewayUpdateProducerHanaDb"
read_endpoint = "/gateway-get-producer"
read_schema = "gatewayGetProducer"
read_response_schema = "DSProducerDetails"
delete_endpoint = "/gateway-delete-producer"
delete_schema = "gatewayDeleteProducer"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = ["name"]

[fields]

[read_mapping]
"item_name" = "name"
"item_targets_assoc.0.target_name" = "target_name"
"user_ttl" = "user_ttl"
