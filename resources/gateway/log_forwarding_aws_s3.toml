# NOTE: Log forwarding is a singleton configuration; the OpenAPI exposes no create or delete endpoint —
# only `gateway-update-log-forwarding-<type>` (upsert) and `gateway-get-log-forwarding`.
# Workaround until the generator gains a config-only resource kind:
# - create_endpoint and update_endpoint both point to the upsert endpoint
# - delete_endpoint points to the same upsert; the generated client should set `enable="false"` on delete
# - force_new_fields is empty since this is a singleton (id_field "name" is a synthetic constant)
# - read_response_schema is `LogForwardingConfigPart`, which contains all per-type sub-configs
[resource]
name = "akeyless_gateway_log_forwarding_aws_s3"
description = "Manages the AWS S3 log forwarding configuration on the gateway (singleton)"
category = "log-forwarding"

[crud]
create_endpoint = "/gateway-update-log-forwarding-aws-s3"
create_schema = "gatewayUpdateLogForwardingAwsS3"
update_endpoint = "/gateway-update-log-forwarding-aws-s3"
update_schema = "gatewayUpdateLogForwardingAwsS3"
read_endpoint = "/gateway-get-log-forwarding"
read_schema = "gatewayGetLogForwarding"
read_response_schema = "LogForwardingConfigPart"
delete_endpoint = "/gateway-update-log-forwarding-aws-s3"
delete_schema = "gatewayUpdateLogForwardingAwsS3"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = []

[fields]

[read_mapping]
"target_log_type" = "name"
