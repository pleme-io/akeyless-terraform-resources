[resource]
name = "akeyless_sign_pkcs1"
description = "Sign a hashed message using RSASSA-PKCS1 v1.5"
category = "crypto"
kind = "action"

[action]
endpoint = "/sign-pkcs1"
schema = "signPKCS1"
response_schema = "SignPKCS1Output"
mutating = true
sensitive_response_fields = ["result"]

[fields]
"key-name" = { description = "Name of the RSA key" }
"message" = { description = "Hashed message to sign" }
"display-id" = { description = "Display ID of the key" }
"item-id" = { type_override = "int", description = "Item ID of the key" }
"hash-function" = { description = "Hash function (e.g. sha-256)" }
"input-format" = { description = "Format assumed for the plaintext message (e.g. base64)" }
"version" = { type_override = "int", description = "Key version" }
