# NOTE: OpenAPI endpoint path uses `certificate-automation` but the operationId/schema is `Venafi`.
[resource]
name = "akeyless_gateway_producer_venafi"
description = "Manages a Venafi gateway producer (deprecated; prefer akeyless_dynamic_secret_venafi)"
category = "gateway-producer"

[crud]
create_endpoint = "/gateway-create-producer-certificate-automation"
create_schema = "gatewayCreateProducerVenafi"
update_endpoint = "/gateway-update-producer-certificate-automation"
update_schema = "gatewayUpdateProducerVenafi"
read_endpoint = "/gateway-get-producer"
read_schema = "gatewayGetProducer"
read_response_schema = "DSProducerDetails"
delete_endpoint = "/gateway-delete-producer"
delete_schema = "gatewayDeleteProducer"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = ["name"]

[fields]

[read_mapping]
"item_name" = "name"
"item_targets_assoc.0.target_name" = "target_name"
"user_ttl" = "user_ttl"
