[resource]
name = "akeyless_encrypt_batch"
description = "Encrypt multiple items in a single batched call"
category = "crypto"
kind = "action"

[action]
endpoint = "/encrypt-batch"
schema = "BatchEncryptionRequestLine"
sdk_method = "encrypt_batch"
mutating = true
sensitive_response_fields = ["result"]

[fields]
"data" = { description = "Base64-encoded plaintext data (per-line)" }
"item_id" = { type_override = "int", description = "Item ID of the key (per-line)" }
"item_version" = { type_override = "int", description = "Key version (per-line)" }
"context" = { description = "Encryption context per-line" }
