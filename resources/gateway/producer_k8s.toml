# NOTE: OpenAPI operationId is `gatewayCreateProducerNativeK8S` (camelCase NativeK8S),
# but endpoint paths use the canonical `k8s` slug.
[resource]
name = "akeyless_gateway_producer_k8s"
description = "Manages a native Kubernetes gateway producer (deprecated; prefer akeyless_dynamic_secret_k8s)"
category = "gateway-producer"

[crud]
create_endpoint = "/gateway-create-producer-k8s"
create_schema = "gatewayCreateProducerNativeK8S"
update_endpoint = "/gateway-update-producer-k8s"
update_schema = "gatewayUpdateProducerNativeK8S"
read_endpoint = "/gateway-get-producer"
read_schema = "gatewayGetProducer"
read_response_schema = "DSProducerDetails"
delete_endpoint = "/gateway-delete-producer"
delete_schema = "gatewayDeleteProducer"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = ["name"]

[fields]

[read_mapping]
"item_name" = "name"
"item_targets_assoc.0.target_name" = "target_name"
"user_ttl" = "user_ttl"
