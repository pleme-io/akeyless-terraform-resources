[resource]
name = "akeyless_gateway_producer_ping"
description = "Manages a Ping Identity gateway producer (deprecated; prefer akeyless_dynamic_secret_ping)"
category = "gateway-producer"

[crud]
create_endpoint = "/gateway-create-producer-ping"
create_schema = "gatewayCreateProducerPing"
update_endpoint = "/gateway-update-producer-ping"
update_schema = "gatewayUpdateProducerPing"
read_endpoint = "/gateway-get-producer"
read_schema = "gatewayGetProducer"
read_response_schema = "DSProducerDetails"
delete_endpoint = "/gateway-delete-producer"
delete_schema = "gatewayDeleteProducer"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = ["name"]

[fields]

[read_mapping]
"item_name" = "name"
"item_targets_assoc.0.target_name" = "target_name"
"user_ttl" = "user_ttl"
