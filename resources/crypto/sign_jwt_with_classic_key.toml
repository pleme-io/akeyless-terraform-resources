[resource]
name = "akeyless_sign_jwt_with_classic_key"
description = "Sign a JWT using a Classic key"
category = "crypto"
kind = "action"

[action]
endpoint = "/sign-jwt-with-classic-key"
schema = "signJWTWithClassicKey"
response_schema = "signJWTOutput"
mutating = true
sensitive_response_fields = ["result"]

[fields]
"display-id" = { required = true, description = "Name (or display ID) of the classic key" }
"jwt-claims" = { required = true, description = "JWT claims payload" }
"signing-method" = { required = true, description = "JWT signing method" }
"version" = { required = true, type_override = "int", description = "Classic key version" }
