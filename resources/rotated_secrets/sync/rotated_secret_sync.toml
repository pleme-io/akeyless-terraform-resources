[resource]
name = "akeyless_rotated_secret_sync"
description = "Sync a rotated secret value to a Universal Secret Connector"
category = "rotated_secret_sync"
kind = "action"

[action]
endpoint = "/rotated-secret-sync"
schema = "rotatedSecretSync"
response_schema = "rotatedSecretSyncOutput"
mutating = true
sensitive_response_fields = []

[fields]
"name" = { required = true, description = "Rotated secret name" }
"usc-name" = { description = "Universal Secret Connector name (if absent, all attached USCs are synced)" }
"remote-secret-name" = { description = "Remote secret name on the USC side" }
"namespace" = { description = "Vault namespace (Hashicorp Vault targets only)" }
"filter-secret-value" = { description = "JQ expression to filter / transform the secret value" }
"DeleteRemote" = { type_override = "bool", description = "Delete the secret from the remote manager on update" }
