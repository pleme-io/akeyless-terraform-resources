[resource]
name = "akeyless_verify_ecdsa"
description = "Verify an ECDSA signature"
category = "crypto"
kind = "action"

[action]
endpoint = "/verify-ecdsa"
schema = "verifyEcDsa"
response_schema = "verifyEcDsaOutput"
mutating = false
sensitive_response_fields = []

[fields]
"message" = { required = true, description = "Base64-encoded message" }
"signature" = { required = true, description = "Signature to verify" }
"key-name" = { description = "Name of the EC key" }
"display-id" = { description = "Display ID of the EC key" }
"item-id" = { type_override = "int", description = "Item ID of the EC key" }
"prehashed" = { type_override = "bool", description = "Whether the message is already hashed" }
"version" = { type_override = "int", description = "Key version" }
