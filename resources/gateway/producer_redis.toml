# NOTE: OpenAPI endpoint paths are case-asymmetric — create is `/gateway-create-producer-Redis`
# (capital R) while update is `/gateway-update-producer-redis` (lowercase). Schema name is `Redis`.
[resource]
name = "akeyless_gateway_producer_redis"
description = "Manages a Redis gateway producer (deprecated; prefer akeyless_dynamic_secret_redis)"
category = "gateway-producer"

[crud]
create_endpoint = "/gateway-create-producer-Redis"
create_schema = "gatewayCreateProducerRedis"
update_endpoint = "/gateway-update-producer-redis"
update_schema = "gatewayUpdateProducerRedis"
read_endpoint = "/gateway-get-producer"
read_schema = "gatewayGetProducer"
read_response_schema = "DSProducerDetails"
delete_endpoint = "/gateway-delete-producer"
delete_schema = "gatewayDeleteProducer"

[identity]
id_field = "name"
import_field = "name"
force_new_fields = ["name"]

[fields]

[read_mapping]
"item_name" = "name"
"item_targets_assoc.0.target_name" = "target_name"
"user_ttl" = "user_ttl"
